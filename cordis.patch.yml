# dsh-todo-queue bundle patch: one insert over the profile tree.
#
# The plugin row activates only when this package is installed as a profile
# dependency (e.g. `dsh plugin --profile web add link:<dir>`).
#
# Host half owns the board file, the serial queue scheduler, session dispatch,
# the `todo_queue` model tool, and the /dsh-todo-queue/api route.
# Browser half renders the standalone main panel and the review overlay.
#
# IMPORTANT: this is an `insert`. Do not ALSO declare a top-level `- id:` entry
# for the same id in your own cordis.patch.yml, or the plugin registers twice.
- insert:
    - id: todo-queue
      name: 'dsh-todo-queue'
